[build]
  publish = "."
  # Genera og/<slug>.png + jugador/<slug>/index.html para cada jugador, y
  # og/partido/<torneo>-<fecha>.png + partido/<torneo>/<fecha>/index.html
  # para cada partido con el 11 titular cargado, antes de publicar — ver
  # scripts/generate-og.js y scripts/generate-partido-og.js. Nada de esto
  # corre en runtime por visita: es un paso más del build, como cualquier
  # otro (ambas rutas se sirven como archivos estáticos comunes, Netlify las
  # encuentra solo — no hace falta ningún redirect ni Netlify Function).
  command = "npm install && npm run build"
