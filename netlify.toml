[build]
  publish = "."
  # Genera og/<slug>.png + jugador/<slug>/index.html para cada jugador, y
  # og/partido/<torneo>-<fecha>.png + partido/<torneo>/<fecha>/index.html
  # para cada partido con el 11 titular cargado, antes de publicar — todo
  # en una sola corrida de scripts/generate-og.js (que al final llama a
  # scripts/generate-partido-og.js reusando el mismo jsdom/fuente/logo, en
  # vez de un segundo script aparte que repetía ese trabajo — eso último
  # fue justo lo que hizo que el build se pasara del límite de tiempo de
  # Netlify). Nada de esto corre en runtime por visita: es un paso más del
  # build, como cualquier otro.
  command = "npm install && npm run build"

[functions]
  directory = "netlify/functions"
  # partido.js/partido-og.js (fallback EN VIVO, ver la nota en
  # scripts/_matchPartidoData.js) necesitan estos 2 paquetes en runtime (no
  # solo en build): resvg-js (rasteriza el SVG a PNG) y los .woff2 reales de
  # Inter que lee scripts/fetch-font.js — sin esto el bundler de Functions
  # puede no detectar estos archivos no-JS dentro de node_modules y
  # quedarían afuera del paquete desplegado.
  included_files = [
    "node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2",
    "node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2",
    "node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2",
    "logo-csb.webp",
  ]

# /partido/:torneo/:fecha (ej. /partido/a/4) → netlify/functions/partido.js
# SOLO cuando partido/:torneo/:fecha/index.html (horneado en build, ver
# scripts/generate-partido-og.js) todavía no existe — Netlify sirve un
# archivo estático real antes que aplicar cualquier redirect (por eso NO
# lleva `force = true`), así que esta función es un fallback automático
# para un partido cargado después del último deploy, no el camino default.
[[redirects]]
  from = "/partido/:torneo/:fecha"
  to = "/.netlify/functions/partido?torneo=:torneo&fecha=:fecha"
  status = 200
