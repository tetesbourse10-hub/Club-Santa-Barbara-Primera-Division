<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Santa Bárbara · Propuesta de diseño nuevo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
:root{--paper:#eef0e6;--paper2:#e3e8d8;--ink:#0f1f17;--mut:#516357;--rule:#c9d0be;--pitch:#0b4d32;--pitch-t:#0b4d32;--grass:#2e9d5b;--yellow:#f1c40f;--red:#d64533;--blue:#1f5fa8;--on:#f4f7ee;--card:#f7f8f1;--sq:var(--pitch-t);--ok:#1f8a4c;--dr:#b8860b}
[data-theme=dark]{--paper:#09140e;--paper2:#0f1d15;--ink:#e8efe2;--mut:#93a698;--rule:#20362a;--pitch-t:#4cc27c;--grass:#4cc27c;--blue:#6aaeea;--card:#0d1a12;--yellow:#f1c40f;--red:#ef6b57;--ok:#4cc27c;--dr:#f1c40f}
[data-sq=b]{--sq:var(--blue)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;margin:0;font-weight:800;letter-spacing:.005em;line-height:1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
/* barra */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:34px;height:38px}
.brand b{font-family:"Big Shoulders Display";font-size:25px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
nav{display:flex;gap:4px;height:100%;margin-left:12px}
nav button{background:none;border:0;padding:0 16px;font-weight:600;color:var(--mut);position:relative;height:100%}
nav button[aria-current=page]{color:var(--ink)}
nav button[aria-current=page]:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:4px;background:var(--sq);border-radius:4px 4px 0 0}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 14px;font-weight:700;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ico{border:1.5px solid var(--rule);background:none;border-radius:8px;width:38px;height:36px;font-size:16px}
/* campo */
.field{background:repeating-linear-gradient(90deg,#0b4d32 0 90px,#0d5637 90px 180px);color:var(--on);position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.field .wrap{position:relative}.field svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.field .in{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:28px 0 26px;min-height:330px}
.cap{position:absolute;left:32px;top:22px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.cap i{font-style:normal;background:var(--yellow);color:#1b1500;font-weight:800;border-radius:4px;padding:2px 8px;font-size:12.5px}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:22px}
.side .name{font-family:"Big Shoulders Display";font-size:44px;font-weight:800;line-height:.95}
.side .pos{font-size:14px;opacity:.85}
.side .pos b{font-family:"Big Shoulders Display";font-size:26px;font-weight:800;margin-right:4px}
.centro{display:grid;place-items:center;text-align:center;width:230px;height:230px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(7,53,34,.5)}
.centro .t{font-family:"Big Shoulders Display";font-weight:800;font-size:76px;line-height:.9}
.centro .t small{font-size:28px;font-weight:700;margin-left:2px}
.centro .l{font-size:13px;opacity:.85}
.centro .w{font-weight:700;font-size:15px}
.hfoot{position:relative;display:flex;gap:18px;justify-content:space-between;align-items:center;padding:14px 0 20px;border-top:1px solid rgba(255,255,255,.22);font-size:14px}
.hfoot a,.link{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;background:none;border:0;padding:0}
.h2h{display:flex;gap:10px;align-items:center}
.h2h .b{display:flex;height:10px;width:150px;border-radius:5px;overflow:hidden}
.crest{display:grid;place-items:center;border-radius:50%;font-family:"Big Shoulders Display";font-weight:800;color:#0b1b12}
.shieldbig{width:92px;height:104px}

main{padding-bottom:70px}
section.blk{padding:44px 0 0}

.hd h2{font-size:34px}

.hd .link{margin-left:auto;color:var(--ink);font-size:14px}
.cols>*{min-width:0}.cols{display:grid;grid-template-columns:7fr 5fr;gap:44px}
table{border-collapse:collapse;width:100%}

td{padding:0 8px;height:44px;text-align:right;border-bottom:1px solid var(--rule)}
td:nth-child(1){text-align:left;width:50px;font-weight:700;color:var(--mut);position:relative;padding-left:14px}
td:nth-child(1):before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:5px;border-radius:3px;background:var(--z,transparent)}

.tag{font-size:12px;font-weight:700;border:1.5px solid currentColor;border-radius:99px;padding:1px 9px;white-space:nowrap}
.gap{margin-top:14px;padding:12px 14px;border-left:5px solid var(--yellow);background:var(--paper2);font-weight:500}
.big1{font-family:"Big Shoulders Display";font-weight:800;font-size:150px;line-height:.82;color:var(--sq)}
.big1 sup{font-size:56px;vertical-align:top;position:relative;top:10px;margin-left:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--rule);margin-top:20px}
.kpis div{padding:12px 0;border-bottom:1px solid var(--rule)}
.kpis b{display:block;font-family:"Big Shoulders Display";font-size:36px;font-weight:800;line-height:1}
.kpis span{font-size:12.5px;color:var(--mut)}
.kpis div:not(:nth-child(3n+1)){padding-left:14px;border-left:1px solid var(--rule)}
.gf{color:var(--ok)}.gc{color:var(--red)}
.ticks{display:flex;gap:5px;margin-top:18px}
.tk{flex:1;height:50px;border-radius:5px;display:grid;place-items:end center;padding-bottom:5px;font-weight:800;font-size:12px;color:#fff}
.tk.G{background:var(--ok)}.tk.E{background:var(--yellow);color:#241b00}.tk.P{background:var(--red)}.tk.N{background:none;border:2px dashed var(--rule);color:var(--mut)}.tk.N.next{border-color:var(--sq);color:var(--sq)}
.lg{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:8px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
/* resultado */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;padding:6px 0 4px}
.score .tm{display:flex;align-items:center;gap:16px}.score .tm:last-child{flex-direction:row-reverse;text-align:right}
.score .tm b{font-family:"Big Shoulders Display";font-size:36px;font-weight:800;line-height:1}
.score .tm>div>span{display:block;color:var(--mut);font-size:14px}
.score .res{font-family:"Big Shoulders Display";font-size:96px;font-weight:800;line-height:.85;display:flex;gap:14px;align-items:center}
.score .res i{font-style:normal;color:var(--mut);font-size:50px}
.vtag{display:inline-block;font-weight:800;border-radius:6px;padding:3px 12px;font-size:14px;color:#fff;margin-left:12px;vertical-align:middle}
.vtag.G{background:var(--ok)}.vtag.E{background:var(--yellow);color:#241b00}.vtag.P{background:var(--red)}
.meta{display:flex;gap:22px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
/* placas */
.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.plate{padding:6px 22px 18px;border-left:1px solid var(--rule)}
.plate:first-child{border-left:0;padding-left:0}
.plate .n{font-family:"Big Shoulders Display";font-size:92px;font-weight:800;line-height:.9}
.plate .k{font-weight:700;margin-top:4px}
.plate .w{color:var(--mut);font-size:14px}
.plate .rule{height:5px;width:44px;margin:10px 0 12px;border-radius:3px}
/* banda historia */
.band{background:var(--pitch);color:var(--on);border-radius:24px;padding:30px 36px;display:grid;grid-template-columns:1.1fr 1.5fr;gap:36px;align-items:center}
[data-theme=dark] .band{background:#0b3a27}
.band h3{font-size:40px}
.band ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.band li{display:flex;gap:12px;align-items:center;font-weight:600}
.band li i{font-style:normal;background:var(--yellow);color:#1b1500;font-weight:800;border-radius:5px;padding:1px 9px;font-size:13px}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.bstats div{padding:0 18px;border-left:1px solid rgba(255,255,255,.25)}
.bstats b{display:block;font-family:"Big Shoulders Display";font-size:60px;font-weight:800;line-height:.95}
.bstats span{font-size:13.5px;opacity:.85}
/* jugadores */
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{border:1.5px solid var(--ink);background:none;border-radius:99px;padding:7px 18px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.rk .p{font-family:"Big Shoulders Display";font-weight:800;font-size:34px;color:var(--mut);text-align:center}
.rk .p.m1{color:#b8860b}.rk .p.m2{color:#7a8a96}.rk .p.m3{color:#a1602a}
.rk .nm b{display:block;font-size:17px}
.rk .ln{height:8px;border-radius:5px;background:var(--paper2);margin-top:6px;overflow:hidden}.rk .ln i{display:block;height:100%;background:var(--sq);border-radius:5px}
.rk .v{font-family:"Big Shoulders Display";font-weight:800;font-size:40px;line-height:1}
.fich{align-self:start;border:2px solid var(--ink);border-radius:22px;padding:22px 24px;background:var(--card);position:sticky;top:84px}
.fich .top{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.fich h3{font-size:36px}.fich .top p{margin:4px 0 0;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.fgrid div{padding:12px 0 10px;border-bottom:1px solid var(--rule)}.fgrid div:not(:nth-child(3n+1)){padding-left:14px;border-left:1px solid var(--rule)}
.fgrid b{display:block;font-family:"Big Shoulders Display";font-size:40px;font-weight:800;line-height:1}.fgrid span{font-size:13px;color:var(--mut)}
/* historia */
.tl{position:relative;margin:6px 0 0 8px;border-left:3px solid var(--ink);padding-left:28px;display:grid;gap:22px}
.tl .it{position:relative}
.tl .it:before{content:"";position:absolute;left:-39px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:4px solid var(--ink)}
.tl .it.w:before{background:var(--yellow)}.tl .it.now:before{background:var(--sq);border-color:var(--sq)}
.tl .y{font-family:"Big Shoulders Display";font-size:34px;font-weight:800;line-height:1}
.tl p{margin:2px 0 0}.tl small{color:var(--mut)}
.sheet{border-top:2px solid var(--ink)}
.sheet .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule)}
.sheet .r span{color:var(--mut)}.sheet .r b{font-family:"Big Shoulders Display";font-size:30px;font-weight:800}
.stackb{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:14px 0 6px}
.note{margin-top:60px;border:1.5px dashed var(--rule);border-radius:14px;padding:14px 18px;color:var(--mut);font-size:13.5px}
.hide{display:none}
@media (max-width:900px){.cap{left:18px}
 .wrap{padding:0 18px}.bar .wrap{gap:10px;height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:0}
 nav{order:3;width:100%;margin:0;overflow-x:auto;height:46px}nav button{padding:0 12px;white-space:nowrap}
 .brand b{font-size:20px}
 .field .in{grid-template-columns:1fr 1fr;gap:10px;padding-top:56px;min-height:0}.centro{grid-column:1/3;width:190px;height:190px;order:-1;margin:0 auto}.centro .t{font-size:58px}.shieldbig{width:64px;height:72px}.side .crest{width:64px!important;height:64px!important;font-size:27px!important}
 .side .name{font-size:30px}.side{margin-top:0}
 .cols,.band,.plates{grid-template-columns:1fr}.plate{border-left:0;padding-left:0;border-top:1px solid var(--rule)}
 .big1{font-size:110px}
 .score{grid-template-columns:1fr}.score .tm:last-child{flex-direction:row;text-align:left}.score .res{font-size:70px}
 .fich{position:static}.bstats b{font-size:44px}
 .tblw{overflow-x:auto}table{min-width:620px}
 .hfoot{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:no-preference){.centro{animation:pulso 3.2s ease-in-out infinite}@keyframes pulso{50%{box-shadow:0 0 0 14px rgba(255,255,255,.07)}}}

.c75{display:grid;grid-template-columns:7fr 5fr;gap:44px}.c57{display:grid;grid-template-columns:5fr 7fr;gap:44px}.c75>*,.c57>*{min-width:0}
.sub{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin:-6px 0 22px;overflow-x:auto}
.sub button{background:none;border:0;padding:10px 2px;font-weight:700;color:var(--mut);position:relative;white-space:nowrap;font-size:16px}
.sub button[aria-pressed=true]{color:var(--ink)}
.sub button[aria-pressed=true]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--sq);border-radius:4px 4px 0 0}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctrl .grow{flex:1;min-width:180px}
input.s,select.s{font:inherit;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;width:100%}
select.s{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--rule);background:none;border-radius:99px;padding:5px 13px;font-weight:600;font-size:13.5px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--paper2)}tr.sel td{background:color-mix(in srgb,var(--sq) 16%,transparent)!important}
.sqt{display:inline-flex;gap:4px}.sqt i{font-style:normal;font-size:11.5px;font-weight:800;border-radius:4px;padding:1px 6px;color:#fff;background:var(--pitch)}.sqt i.b{background:var(--blue)}
td.l,th.l{text-align:left!important}
tr.grp td{height:36px;background:var(--paper2);font-family:"Big Shoulders Display";font-weight:800;font-size:19px;text-align:left;padding-left:14px}

.fx{display:grid;grid-template-columns:64px 36px 1fr auto 90px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.fx .f{font-family:"Big Shoulders Display";font-weight:800;font-size:26px;color:var(--mut)}
.fx .cd{font-size:12px;font-weight:800;border:1.5px solid var(--rule);border-radius:5px;text-align:center;padding:1px 0;color:var(--mut)}
.fx .tm{display:flex;gap:10px;align-items:center;font-weight:600}
.fx .sc{font-family:"Big Shoulders Display";font-weight:800;font-size:34px;line-height:1;text-align:center;min-width:80px}
.fx.nx .sc{color:var(--mut);font-size:22px}
.ribbon{display:inline-flex;gap:8px;align-items:center;background:var(--yellow);color:#1b1500;font-weight:800;border-radius:6px;padding:3px 12px;font-size:14px}
.bal{display:flex;height:9px;border-radius:5px;overflow:hidden;min-width:110px;background:var(--paper2)}
.pos-c{font-weight:700;color:var(--mut)}
.arch{display:grid;grid-template-columns:90px 1fr;gap:6px 24px;padding:16px 0;border-bottom:2px solid var(--ink)}
.arch .y{font-family:"Big Shoulders Display";font-weight:800;font-size:44px;line-height:.9}
.arch .it{display:grid;grid-template-columns:1fr 170px 70px 120px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}

.arch .it b.rs{font-weight:700}.arch .it .w{display:inline-block;background:var(--yellow);color:#1b1500;font-weight:800;border-radius:5px;padding:1px 9px;font-size:13px}

.sm{font-size:13.5px;color:var(--mut)}
@media (max-width:900px){.hd{flex-wrap:wrap;gap:4px 14px}.hd h2{white-space:nowrap}.c75,.c57{grid-template-columns:1fr;gap:28px}
 .fx{grid-template-columns:44px 30px 1fr auto;}.fx .rt{display:none}.fx .f{font-size:22px}.fx .sc{font-size:28px;min-width:60px}
 .arch{grid-template-columns:1fr}.arch .it{grid-template-columns:1fr auto}.arch .it .c3,.arch .it .c4{display:none}
 table.nw{min-width:560px}}
</style></head><body data-sq="a" data-theme="light">
<header class="bar"><div class="wrap">
 <div class="brand"><svg viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 32 6v14c0 9-6 15-15 17C8 35 2 29 2 20V6z" fill="#0b4d32" stroke="#f1c40f" stroke-width="2"/><path d="M10 25c4-1 6-5 6-9m0 0c1-3 5-4 8-3-1 2-3 3-5 3m-3 0 1 9" stroke="#f4f7ee" stroke-width="2" fill="none" stroke-linecap="round"/></svg><b>Club Santa Bárbara</b></div>
 <nav id="nav" aria-label="Secciones"></nav>
 <div class="tools"><div class="seg" role="group" aria-label="Plantel"><button id="sa" aria-pressed="true">Primera A</button><button id="sb" aria-pressed="false">Primera B</button></div><button class="ico" id="th" aria-label="Cambiar a modo noche" title="Modo noche">☾</button></div>
</div></header>
<main id="app"></main>
<script>
const COLS=['#f6a94a','#7fb8ea','#b9a5e6','#f09ac0','#7fd6a3','#f0d35c','#6fd3df','#ef8f80'];
const crest=(n,s)=>{const h=[...n].reduce((a,c)=>a+c.charCodeAt(0),0);const ini=n.replace(/\./g,'').split(' ').map(w=>w[0]).join('').slice(0,2);return `<span class="crest" style="width:${s}px;height:${s}px;background:${COLS[h%8]};font-size:${Math.round(s*.42)}px">${ini}</span>`};
const SHIELD=`<svg class="shieldbig" viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 32 6v14c0 9-6 15-15 17C8 35 2 29 2 20V6z" fill="#eef0e6" stroke="#f1c40f" stroke-width="1.6"/><path d="M10 25c4-1 6-5 6-9m0 0c1-3 5-4 8-3-1 2-3 3-5 3m-3 0 1 9" stroke="#0b4d32" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const Z={g:'var(--ok)',b:'#4a90d9',a:'#d9a400',r:'var(--red)'};
const P=s=>s.trim().split(';').map(x=>x.split(','));
const FIX=s=>s.split(';').map(x=>{const p=x.split('|');const sc=p[3]?p[3].split('-').map(Number):null;return{f:+p[0],l:p[1],r:p[2],gf:sc?sc[0]:null,gc:sc?sc[1]:null,when:p[4]||''}});
